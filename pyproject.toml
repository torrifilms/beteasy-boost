[project]
name = "eb-predictions"
version = "1.1.0"
description = "Ежедневные прогнозы BETEASY: линия, самый вероятный исход, текст, публикация и расчёт."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
eb-predictions = "eb_predictions.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
